<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Environmental research sensing: a seabed station sends measurement pulses up through the water column to the ice sheet, profiling ice thickness and salinity</title>
  <style>
    .dot-b { animation: blink 3.2s ease-in-out infinite; }
    .dot-b2 { animation: blink 2.6s ease-in-out infinite 0.9s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .pulse { animation: pulse 8s linear infinite; }
    @keyframes pulse { 0% { transform: translateY(0); opacity: 0; } 6% { opacity: 0.9; } 46% { transform: translateY(-224px); opacity: 0.9; } 52% { transform: translateY(-224px); opacity: 0.4; } 94% { transform: translateY(0); opacity: 0.4; } 100% { transform: translateY(0); opacity: 0; } }
    .iring { transform-origin: 400px 128px; animation: iring 8s ease-out infinite; opacity: 0; }
    @keyframes iring { 0%, 44% { transform: scale(0.2); opacity: 0; } 48% { opacity: 0.4; } 70% { transform: scale(1); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
    .f1 { animation: swim1 18s ease-in-out infinite alternate; }
    @keyframes swim1 { from { transform: translate(0,0); } to { transform: translate(-48px, 6px); } }
    .f2 { animation: swim2 14s ease-in-out infinite alternate; }
    @keyframes swim2 { from { transform: translate(0,0); } to { transform: translate(40px, -8px); } }
    .snow { animation: snow 13s linear infinite; opacity: 0; }
    .snow.s2 { animation-delay: 4.5s; }
    .snow.s3 { animation-delay: 9s; }
    @keyframes snow { 0% { transform: translateY(-10px); opacity: 0; } 15% { opacity: 0.14; } 100% { transform: translateY(70px); opacity: 0; } }
    .wave-poly { animation: wv 2.8s linear infinite; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    .flag { animation: sway 6s ease-in-out infinite alternate; transform-origin: bottom left; }
    @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
