<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Pipeline communications: a surface wave carrying telemetry along a subsea pipeline between valve stations while a UUV inspects mid-span</title>
  <style>
    .l-flow { stroke-dasharray: 6 9; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -165; } }
    .dot-b { animation: blink 3.2s ease-in-out infinite; }
    .dot-b2 { animation: blink 2.6s ease-in-out infinite 0.9s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .uuv-g { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(14px, -3px); } }
    .wave-poly { animation: wv 2.8s linear infinite; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    .grass { animation: sway 7s ease-in-out infinite alternate; transform-origin: bottom center; }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
