<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Underwater communications: a tracked UUV exchanging clear audio with a surface buoy over a surface-wave route, beside a wooded island, with a seabed relay node below</title>
  <style>
    .l-flow { stroke-dasharray: 5 8; animation: flow 5.5s linear infinite; }
    .l-flow2 { stroke-dasharray: 3 9; animation: flow 8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -156; } }
    .ring { transform-origin: 601px 168px; animation: ping 7s ease-out infinite; opacity: 0; }
    .ring.r2 { animation-delay: 3.5s; }
    @keyframes ping { 0% { transform: scale(0.15); opacity: 0.3; } 65% { transform: scale(1); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
    .uuv-g { animation: drift 13s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(20px, -6px); } }
    .dot-b { animation: blink 3.4s ease-in-out infinite; }
    .dot-b2 { animation: blink 2.6s ease-in-out infinite 0.9s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .bub { animation: bub 4.8s linear infinite; opacity: 0; }
    .bub.b2 { animation-delay: 1.6s; }
    .bub.b3 { animation-delay: 3.2s; }
    @keyframes bub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.5; } 100% { transform: translateY(-34px); opacity: 0; } }
    .wave-poly { animation: wv 2.8s linear infinite; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    .twinkle { animation: blink 5.5s ease-in-out infinite 2s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
