<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Under-ice communications: a polar surface station relays data down through a thick ice sheet, along its underside, and down to a tracked unmanned underwater vehicle drifting through marine snow above the seabed</title>
  <style>
    .l-flow { stroke-dasharray: 5 8; animation: flow 5.5s linear infinite; }
    .l-flow2 { stroke-dasharray: 3 9; animation: flow 8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -156; } }
    .ring { transform-origin: 96px 30px; animation: ping 7s ease-out infinite; opacity: 0; }
    .ring.r2 { animation-delay: 3.5s; }
    .iring { transform-origin: 520px 160px; animation: ping 6.5s ease-out infinite 1.2s; opacity: 0; }
    .iring.r2 { animation-delay: 4.4s; }
    @keyframes ping { 0% { transform: scale(0.15); opacity: 0.35; } 65% { transform: scale(1); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
    .uuv-g { animation: drift 12s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-18px, -6px); } }
    .dot-b { animation: blink 3.4s ease-in-out infinite; }
    .dot-b2 { animation: blink 2.7s ease-in-out infinite 0.9s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .bub { animation: bub 5s linear infinite; opacity: 0; }
    .bub.b2 { animation-delay: 1.7s; }
    .bub.b3 { animation-delay: 3.4s; }
    @keyframes bub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.5; } 100% { transform: translateY(-30px); opacity: 0; } }
    .snw { animation: fall 10s linear infinite; opacity: 0; }
    .snw.s2 { animation-delay: 2.5s; }
    .snw.s3 { animation-delay: 5s; }
    .snw.s4 { animation-delay: 7.5s; }
    @keyframes fall { 0% { transform: translateY(-4px); opacity: 0; } 12% { opacity: 0.35; } 85% { opacity: 0.3; } 100% { transform: translateY(24px); opacity: 0; } }
    .wave-poly { animation: wv 2.8s linear infinite; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    .twinkle { animation: blink 5.5s ease-in-out infinite 2s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
