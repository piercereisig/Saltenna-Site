<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Counter-trafficking sensing: an inspection unit scans a sealed container on a dock and an abstract vital-sign indicator confirms a presence inside without opening it</title>
  <style>
    .dot-b { animation: blink 3.2s ease-in-out infinite; }
    .dot-b2 { animation: blink 2.6s ease-in-out infinite 0.9s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .scanline { animation: scan 10s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateX(0); } 50% { transform: translateX(304px); } 100% { transform: translateX(0); } }
    .vital { animation: vital 10s ease-in-out infinite; opacity: 0; }
    @keyframes vital { 0%, 30% { opacity: 0; } 42%, 84% { opacity: 1; } 94%, 100% { opacity: 0; } }
    .vring { transform-origin: 452px 330px; animation: vring 2.8s ease-out infinite; opacity: 0; }
    .vring.v2 { animation-delay: 1.4s; }
    @keyframes vring { 0% { transform: scale(0.3); opacity: 0.4; } 80% { transform: scale(1); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
    .alert { animation: alert 10s ease-in-out infinite; opacity: 0; }
    @keyframes alert { 0%, 40% { opacity: 0; } 52%, 86% { opacity: 0.95; } 96%, 100% { opacity: 0; } }
    .ecg { stroke-dasharray: 120 400; animation: ecg 2.8s linear infinite; }
    @keyframes ecg { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
