<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Around-aircraft communications: a ground crew cart holding a surface-wave voice link through the steel wall of Hangar 3 to a tracked aircraft inside, with a relay mast down the flightline</title>
  <style>
    .l-flow { stroke-dasharray: 5 8; animation: flow 5.5s linear infinite; }
    .l-flow2 { stroke-dasharray: 3 9; animation: flow 8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -156; } }
    .ring { transform-origin: 464px 271px; animation: ping 7s ease-out infinite; opacity: 0; }
    .ring.r2 { animation-delay: 3.5s; }
    @keyframes ping { 0% { transform: scale(0.15); opacity: 0.35; } 65% { transform: scale(1); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
    .glow-p { animation: gpulse 4.5s ease-in-out infinite; }
    @keyframes gpulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .dot-b { animation: blink 3.4s ease-in-out infinite; }
    .dot-b2 { animation: blink 2.6s ease-in-out infinite 0.9s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .wave-poly { animation: wv 2.8s linear infinite; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    .twinkle { animation: blink 5.5s ease-in-out infinite 2s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
