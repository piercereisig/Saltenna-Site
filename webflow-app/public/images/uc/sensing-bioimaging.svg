  <style>
    .dot-b { animation: blink 3.2s ease-in-out infinite; }
    .dot-b2 { animation: blink 2.6s ease-in-out infinite 0.9s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .scanline { animation: scan 9s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateY(0); } 50% { transform: translateY(196px); } 100% { transform: translateY(0); } }
    .lay { animation: lay 9s ease-in-out infinite; }
    .lay.l2 { animation-delay: 0.8s; }
    .lay.l3 { animation-delay: 1.6s; }
    @keyframes lay { 0%, 10% { opacity: 0.18; } 35%, 60% { opacity: 0.5; } 88%, 100% { opacity: 0.18; } }
    .anom { animation: anom 9s ease-in-out infinite; opacity: 0.25; }
    @keyframes anom { 0%, 30% { opacity: 0.25; } 45%, 80% { opacity: 1; } 95%, 100% { opacity: 0.25; } }
    .aring { transform-origin: 442px 262px; animation: aring 3s ease-out infinite; opacity: 0; }
    @keyframes aring { 0% { transform: scale(0.3); opacity: 0.5; } 80% { transform: scale(1); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
    .wave-poly { animation: wv 2.8s linear infinite; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
