    .tw2 { animation: blink 6.5s ease-in-out infinite 2.6s; }
    .tw3 { animation: blink 7.5s ease-in-out infinite 4s; }
    .rover { animation: rove 16s ease-in-out infinite alternate; }
    @keyframes rove { from { transform: translateX(0); } to { transform: translateX(7px); } }
    .wave-poly { animation: wv 2.8s linear infinite; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
