<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Aquaculture sensing: a fish pen with drifting fish, an integrity pulse traveling the net, kelp on the seabed, and a monitoring buoy at the float line</title>
  <style>
    .l-flow { stroke-dasharray: 4 10; animation: flow 7s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -154; } }
    .dot-b { animation: blink 3.2s ease-in-out infinite; }
    .dot-b2 { animation: blink 2.6s ease-in-out infinite 0.9s; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .f1 { animation: swim1 16s ease-in-out infinite alternate; }
    @keyframes swim1 { from { transform: translate(0,0); } to { transform: translate(56px, 10px); } }
    .f2 { animation: swim2 13s ease-in-out infinite alternate; }
    @keyframes swim2 { from { transform: translate(0,0); } to { transform: translate(-44px, -8px); } }
    .f3 { animation: swim3 19s ease-in-out infinite alternate; }
    @keyframes swim3 { from { transform: translate(0,0); } to { transform: translate(38px, -14px); } }
    .kelp { animation: sway 8s ease-in-out infinite alternate; transform-origin: bottom center; }
    .kelp.k2 { animation-duration: 10s; }
    @keyframes sway { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg); } }
    .wave-poly { animation: wv 2.8s linear infinite; }
    @keyframes wv { from { transform: translateX(0); } to { transform: translateX(-24px); } }
    .snow { animation: snow 12s linear infinite; opacity: 0; }
    .snow.s2 { animation-delay: 4s; }
    .snow.s3 { animation-delay: 8s; }
    @keyframes snow { 0% { transform: translateY(-8px); opacity: 0; } 15% { opacity: 0.14; } 100% { transform: translateY(60px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
