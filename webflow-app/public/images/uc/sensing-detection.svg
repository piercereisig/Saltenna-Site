    </symbol>
    <symbol id="bush3" viewBox="0 0 12 10">
      <ellipse cx="5" cy="6" rx="5" ry="3.6" fill="#37453e"/><ellipse cx="8" cy="4.6" rx="3.4" ry="2.6" fill="#48564e"/>
