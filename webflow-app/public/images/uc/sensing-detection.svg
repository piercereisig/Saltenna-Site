<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Adversary detection in denied environments: a seabed passive array sweeps dark water with slow rings that briefly reveal an intruder UUV inside a thin red tracking box</title>
  <style>
    .ring { transform-origin: 400px 380px; animation: ping 8s linear infinite; opacity: 0; }
    .ring.r2 { animation-delay: 4s; }
    @keyframes ping { 0% { transform: scale(0.06); opacity: 0.3; } 70% { transform: scale(1); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
    .dot-b { animation: blink 3.2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .intruder { animation: lurk 8s linear infinite; }
    @keyframes lurk { 0%, 30% { opacity: 0.35; } 42%, 55% { opacity: 1; } 70%, 100% { opacity: 0.35; } }
    .con { animation: con 8s linear infinite; opacity: 0; }
    @keyframes con { 0%, 38% { opacity: 0; } 48%, 78% { opacity: 0.85; } 90%, 100% { opacity: 0; } }
    .drift-i { animation: driftI 18s ease-in-out infinite alternate; }
    @keyframes driftI { from { transform: translate(0,0); } to { transform: translate(-26px, 8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
