      <stop offset="0" stop-color="#0c141f"/><stop offset="0.5" stop-color="#0e1621"/><stop offset="1" stop-color="#121c28"/>
    </linearGradient>
    <radialGradient id="vg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.55" stop-color="#0a121d" stop-opacity="0"/><stop offset="1" stop-color="#0a121d" stop-opacity="0.5"/>
    </radialGradient>
    <symbol id="bush1" viewBox="0 0 20 14">
