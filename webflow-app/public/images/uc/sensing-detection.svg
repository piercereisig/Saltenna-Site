    <symbol id="rock" viewBox="0 0 16 10"><path d="M2 10 L5 3 L9 5 L12 2 L15 10 Z" fill="#1a2733"/><path d="M5 3 L9 5 L8 10 L2 10 Z" fill="#232f3d"/></symbol>
    <symbol id="plus" viewBox="0 0 8 8"><path d="M4 0v8M0 4h8" stroke="#eef2f6" stroke-width="1" fill="none"/></symbol>
