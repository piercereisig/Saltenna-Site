<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1fa"/>
      <stop offset="1" stop-color="#b8dff0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d7fb8"/>
      <stop offset="0.45" stop-color="#0e5488"/>
      <stop offset="1" stop-color="#062c4e"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bfe9ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="190" fill="url(#sky)"/>
  <!-- water -->
  <rect x="0" y="190" width="1600" height="810" fill="url(#water)"/>
  <!-- waterline -->
  <path d="M0,190 Q100,182 200,190 T400,190 T600,190 T800,190 T1000,190 T1200,190 T1400,190 T1600,190" fill="none" stroke="#f3fbff" stroke-width="5"/>

  <!-- sun rays -->
  <polygon points="620,196 700,196 560,620 460,620" fill="url(#ray)"/>
  <polygon points="760,196 830,196 780,680 660,680" fill="url(#ray)"/>
  <polygon points="900,196 980,196 1010,600 900,600" fill="url(#ray)"/>

  <!-- seabed -->
  <path d="M0,900 Q200,870 400,895 T800,890 T1200,900 T1600,880 L1600,1000 L0,1000 Z" fill="#0a2033"/>
  <path d="M0,920 Q250,895 500,918 T1000,915 T1600,905 L1600,1000 L0,1000 Z" fill="#071626"/>
  <!-- coral / rocks -->
  <g fill="#0e2c44">
    <path d="M120,900 q10,-50 22,0 q8,-38 18,0 q10,-26 16,0 z"/>
    <path d="M370,905 q14,-60 26,0 q10,-42 20,0 z"/>
    <circle cx="700" cy="898" r="26"/>
    <circle cx="735" cy="905" r="18"/>
    <path d="M1050,905 q12,-55 24,0 q9,-35 18,0 q9,-24 15,0 z"/>
    <path d="M1380,895 q15,-48 28,0 q12,-30 20,0 z"/>
  </g>

  <!-- CRRC boat on surface, side view (inflatable: upswept bow tube, outboard motor) -->
  <g id="boat">
    <!-- pontoon tube with upswept bow (bow at left) -->
    <path d="M1078,152 Q1060,152 1048,168 Q1040,178 1044,188 L1330,188 Q1344,188 1344,174 Q1344,160 1328,160 L1120,160 Q1096,158 1078,152 Z" fill="#10181f"/>
    <!-- tube highlight to read as rounded rubber -->
    <path d="M1070,162 Q1090,168 1130,169 L1310,169" fill="none" stroke="#2a3844" stroke-width="4" stroke-linecap="round"/>
    <!-- shallow hull below waterline -->
    <path d="M1052,190 L1336,190 Q1330,204 1304,206 L1088,206 Q1062,202 1052,190 Z" fill="#050a0e"/>
    <!-- transom + outboard motor at stern (right) -->
    <rect x="1338" y="156" width="15" height="36" rx="3" fill="#10181f"/>
    <rect x="1342" y="192" width="7" height="30" fill="#050a0e"/>
    <!-- antenna mast on bow -->
    <line x1="1072" y1="150" x2="1072" y2="108" stroke="#10181f" stroke-width="5"/>
    <circle cx="1072" cy="106" r="5" fill="#10181f"/>
  </g>

  <!-- divers (human silhouettes, horizontal, neutral buoyancy) -->
  <defs>
    <g id="diver" fill="#0b1c2c">
      <!-- head with mask -->
      <circle cx="86" cy="-12" r="16"/>
      <rect x="94" y="-18" width="12" height="10" rx="3" fill="#12344e"/>
      <!-- torso -->
      <path d="M-10,-16 Q30,-24 66,-16 Q78,-12 76,0 Q72,12 52,14 Q16,18 -12,10 Q-22,4 -10,-16 Z"/>
      <!-- tank on back -->
      <rect x="6" y="-34" width="52" height="15" rx="7" fill="#123049"/>
      <!-- front arm reaching forward-down -->
      <path d="M60,4 Q76,22 94,26 L98,18 Q82,12 70,-2 Z"/>
      <!-- upper leg + fin -->
      <path d="M-10,-12 Q-46,-16 -74,-8 L-72,0 Q-44,-6 -12,-2 Z"/>
      <path d="M-74,-12 L-112,-20 Q-118,-12 -110,-4 L-74,-2 Z"/>
      <!-- lower leg + fin (slightly apart, mid-kick) -->
      <path d="M-12,8 Q-42,16 -66,26 L-62,34 Q-38,24 -10,18 Z"/>
      <path d="M-66,24 L-102,38 Q-104,46 -94,48 L-60,34 Z"/>
    </g>
  </defs>
  <g>
    <use href="#diver" transform="translate(310,560) rotate(-8)"/>
    <use href="#diver" transform="translate(700,660) rotate(6)"/>
    <use href="#diver" transform="translate(1080,580) rotate(-4)"/>
  </g>

  <!-- bubbles -->
  <g fill="none" stroke="#bfe9ff" stroke-opacity="0.5" stroke-width="2">
    <circle cx="380" cy="500" r="5"/><circle cx="390" cy="460" r="7"/><circle cx="378" cy="415" r="9"/>
    <circle cx="770" cy="600" r="5"/><circle cx="782" cy="555" r="7"/><circle cx="772" cy="505" r="9"/>
    <circle cx="1150" cy="520" r="5"/><circle cx="1160" cy="475" r="7"/><circle cx="1150" cy="430" r="9"/>
  </g>

  <!-- wireless links -->
  <g stroke="#35e0ff" stroke-width="5" filter="url(#glow)" stroke-dasharray="16 12" fill="none">
    <line x1="330" y1="562" x2="700" y2="655"/>
    <line x1="720" y1="655" x2="1080" y2="580"/>
    <line x1="1100" y1="572" x2="1185" y2="212"/>
  </g>

  <!-- nodes with pulse rings -->
  <g>
    <g fill="none" stroke="#7deeff">
      <g stroke-opacity="0.9" stroke-width="3">
        <circle cx="322" cy="560" r="22"/><circle cx="708" cy="656" r="22"/><circle cx="1090" cy="578" r="22"/><circle cx="1188" cy="200" r="22"/>
      </g>
      <g stroke-opacity="0.45" stroke-width="3">
        <circle cx="322" cy="560" r="38"/><circle cx="708" cy="656" r="38"/><circle cx="1090" cy="578" r="38"/><circle cx="1188" cy="200" r="38"/>
      </g>
      <g stroke-opacity="0.2" stroke-width="3">
        <circle cx="322" cy="560" r="56"/><circle cx="708" cy="656" r="56"/><circle cx="1090" cy="578" r="56"/><circle cx="1188" cy="200" r="56"/>
      </g>
    </g>
    <g fill="#ffffff" filter="url(#glow)">
      <circle cx="322" cy="560" r="8"/><circle cx="708" cy="656" r="8"/><circle cx="1090" cy="578" r="8"/><circle cx="1188" cy="200" r="8"/>
    </g>
  </g>

  <!-- labels -->
  <g fill="#f3fbff" font-size="26">
    <g font-size="34" font-weight="bold">
      <text x="60" y="70" fill="#0b2a40">Through-Water Wireless Link</text>
    </g>
    <text x="60" y="108" fill="#265a78" font-size="22">Diver-to-diver and diver-to-surface connectivity — no tethers, no cables</text>

    <!-- surface node label -->
    <line x1="1290" y1="90" x2="1200" y2="160" stroke="#265a78" stroke-width="2"/>
    <text x="1300" y="82" font-size="24" fill="#0b2a40">Surface gateway (CRRC)</text>

    <!-- diver node label -->
    <line x1="250" y1="470" x2="312" y2="548" stroke="#f3fbff" stroke-width="2"/>
    <text x="80" y="460" font-size="24">Diver-worn transceiver</text>

    <!-- link label -->
    <line x1="560" y1="720" x2="520" y2="622" stroke="#f3fbff" stroke-width="2"/>
    <text x="470" y="752" font-size="24">Wireless through-water link</text>

    <!-- seabed label -->
    <text x="60" y="965" font-size="22" fill="#7fa8c4">Seabed</text>
  </g>
</svg>
